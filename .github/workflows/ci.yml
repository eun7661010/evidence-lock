name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest --cov=evidence_lock --cov-branch --cov-report=term-missing
      - name: Verify CLI and synthetic review flow
        shell: bash
        run: |
          evidence-lock --help
          evidence-lock create \
            --root examples/synthetic-project \
            --source source/draft.txt \
            --artifact artifact/report.txt \
            --policy policy/review-policy.json \
            --output ci-pending.json
          evidence-lock review ci-pending.json \
            --root examples/synthetic-project \
            --reviewer reviewer-ci \
            --reviewer-type human \
            --decision approved \
            --output ci-approved.json
          evidence-lock verify ci-approved.json \
            --root examples/synthetic-project \
            --format json
      - name: Verify generated public files are current
        shell: bash
        run: |
          python tools/generate_synthetic_receipts.py
          git diff --exit-code

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
